name: CI

on:
  pull_request:
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  frontend:
    name: Frontend contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            renderer/package-lock.json

      - name: Install renderer dependencies
        run: npm ci --prefix renderer

      - name: Audit design-system boundaries
        run: npm run check:design-system

      - name: Lint renderer
        run: npm run lint:ui --prefix renderer

      - name: Test renderer
        run: npm run test --prefix renderer

      - name: Build Storybook
        run: npm run build-storybook --prefix renderer

      - name: Build renderer
        run: npm run build --prefix renderer
